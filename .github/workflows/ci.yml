name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: eventsapp
          POSTGRES_PASSWORD: eventsapp
          POSTGRES_DB: eventsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U eventsapp -d eventsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Test
        working-directory: backend
        run: go test -race ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test migrations up, down and up
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE/backend/migrations:/migrations:ro" migrate/migrate:v4.19.1 -path /migrations -database "postgres://eventsapp:eventsapp@localhost:5432/eventsapp?sslmode=disable&search_path=public" up
          docker run --rm --network host -v "$GITHUB_WORKSPACE/backend/migrations:/migrations:ro" migrate/migrate:v4.19.1 -path /migrations -database "postgres://eventsapp:eventsapp@localhost:5432/eventsapp?sslmode=disable&search_path=public" down -all
          docker run --rm --network host -v "$GITHUB_WORKSPACE/backend/migrations:/migrations:ro" migrate/migrate:v4.19.1 -path /migrations -database "postgres://eventsapp:eventsapp@localhost:5432/eventsapp?sslmode=disable&search_path=public" up
      - name: Check generated Swagger
        working-directory: backend
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/eventsapp/main.go -o docs --parseInternal --parseDependency
          git diff --exit-code -- docs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
