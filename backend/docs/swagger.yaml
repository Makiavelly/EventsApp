info:
  contact: {}
  description: Events Application REST-API scheme
  title: GoLang EventsApp API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверить учётные данные и получить токен доступа
      parameters:
      - description: Login тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная аутентификация
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.LoginResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "413":
          description: Payload too large
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      summary: Войти в аккаунт
      tags:
      - auth
  /auth/logout:
    post:
      description: Отозвать refresh-сессию и удалить HttpOnly cookie
      responses:
        "204":
          description: Успешный выход
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      summary: Выйти из аккаунта
      tags:
      - auth
  /auth/me:
    get:
      description: Получить профиль пользователя из токена доступа
      produces:
      - application/json
      responses:
        "200":
          description: Текущий пользователь
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.GetCurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить текущего пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      description: Ротировать refresh token из HttpOnly cookie и выдать новый access
        JWT
      produces:
      - application/json
      responses:
        "200":
          description: Токены обновлены
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      summary: Обновить access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создать аккаунт и получить токен доступа
      parameters:
      - description: Register тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь зарегистрирован
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RegisterResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "413":
          description: Payload too large
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      summary: Зарегистрировать пользователя
      tags:
      - auth
  /events:
    get:
      description: Получить список событий с опциональным поиском по локации и пагинацией
      parameters:
      - description: Широта пользователя
        in: query
        name: latitude
        type: number
      - description: Долгота пользователя
        in: query
        name: longitude
        type: number
      - description: Радиус поиска событий
        in: query
        name: radius
        type: integer
      - description: Западная граница видимой области
        in: query
        name: west
        type: number
      - description: Южная граница видимой области
        in: query
        name: south
        type: number
      - description: Восточная граница видимой области
        in: query
        name: east
        type: number
      - description: Северная граница видимой области
        in: query
        name: north
        type: number
      - description: Лимит событий
        in: query
        name: limit
        type: integer
      - description: Смещение событий
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученный список событий
          schema:
            items:
              $ref: '#/definitions/internal_features_events_transport_http.EventDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      summary: Получить события
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Создать новое событие в системе
      parameters:
      - description: Create event тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_events_transport_http.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданное событие
          schema:
            $ref: '#/definitions/internal_features_events_transport_http.CreateEventResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "413":
          description: Payload too large
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать событие
      tags:
      - events
  /events/{id}:
    delete:
      description: Удалить событие по ID
      parameters:
      - description: ID события
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Событие успешно удалено
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Event not found
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить событие
      tags:
      - events
    get:
      description: Получить событие по ID
      parameters:
      - description: ID события
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученное событие
          schema:
            $ref: '#/definitions/internal_features_events_transport_http.GetEventResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Event not found
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      summary: Получить событие
      tags:
      - events
    patch:
      consumes:
      - application/json
      description: |-
        Частично обновить событие по ID
        ###Логика обновления полей (Three-state logic):
        1. **Поле не передано**: поле игнорируется, значение в БД не меняется
        2. **Явно передано значение**: `"title":"Meetup"` - устанавливает новое значение в БД
        3. **Явно передан null**: nullable-поля очищаются в БД
      parameters:
      - description: ID события
        in: path
        name: id
        required: true
        type: integer
      - description: Patch event тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_events_transport_http.PatchEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно обновленное событие
          schema:
            $ref: '#/definitions/internal_features_events_transport_http.PatchEventResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Event not found
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "413":
          description: Payload too large
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить событие
      tags:
      - events
  /participants:
    delete:
      description: Удалить пользователя из участников события
      parameters:
      - description: ID события
        in: query
        name: event_id
        required: true
        type: integer
      responses:
        "204":
          description: Участник события успешно удален
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Participant not found
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить участника события
      tags:
      - participants_events
    get:
      description: Получить список участников событий с опциональной фильтрацией по
        событию и пагинацией
      parameters:
      - description: ID события
        in: query
        name: event_id
        type: integer
      - description: Лимит участников
        in: query
        name: limit
        type: integer
      - description: Смещение участников
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученный список участников событий
          schema:
            items:
              $ref: '#/definitions/internal_features_participants_events_transport_http.EventParticipantDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      summary: Получить участников событий
      tags:
      - participants_events
    patch:
      consumes:
      - application/json
      description: Обновить статус участника события
      parameters:
      - description: ID события
        in: query
        name: event_id
        required: true
        type: integer
      - description: Patch participant тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_participants_events_transport_http.PatchParticipantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно обновленный участник события
          schema:
            $ref: '#/definitions/internal_features_participants_events_transport_http.PatchParticipantResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Participant not found
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "413":
          description: Payload too large
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Makiavelly_EventsApp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить участника события
      tags:
      - participants_events
    post:
      consumes:
      - application/json
      description: Добавить пользователя в участники события
      parameters:
      - description: Create participant тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_participants_events_transport_http.CreateParticipantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданный участник события
          schema:
            $ref: '#/definitions/internal_features_participants_events_transport_http.CreateParticipantResponse'
        "400":
