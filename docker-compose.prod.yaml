services:
  edge:
    image: caddy:2.10-alpine
    container_name: eventsapp-edge
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    networks:
      eventsapp-edge:
        ipv4_address: 172.31.255.2
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  eventsapp:
    environment:
      AUTH_REFRESH_COOKIE_SECURE: "true"
      HTTP_ALLOWED_ORIGINS: https://${APP_DOMAIN}

volumes:
  caddy_data:
  caddy_config:
