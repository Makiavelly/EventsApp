services:
  eventsapp:
    build:
      context: ./backend
      dockerfile: cmd/eventsapp/Dockerfile
    container_name: eventsapp
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=eventsapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - "5050:5050"
    restart: always
  
  eventsapp-postgres:
    image: postgis/postgis:18-3.6
    container_name: eventsapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: always

  eventsapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./backend/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: eventsapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:eventsapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
  
  swagger:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM golang:1.26.4-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ./backend:/code
