server {
    listen 8080;
    server_name _;
    # Only the production Caddy address on the dedicated edge network may
    # supply the original client address. Direct/local clients are never trusted.
    set_real_ip_from 172.31.255.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://eventsapp:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/live {
        proxy_pass http://eventsapp:5050/health/live;
    }

    location = /health/ready {
        proxy_pass http://eventsapp:5050/health/ready;
    }

    location = /metrics {
        proxy_pass http://eventsapp:5050/metrics;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
